ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@aa900031/release-it-config@1.0.0'
  - '@directus/sdk@25.0.1'

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
autoInstallPeers: false
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - docs
  - examples/*
  - packages/*
  - internals/*
  - stories/*
  - packages/nuxt/playground

overrides:
  '@tanstack/vue-query>vue-demi': latest

allowBuilds:
  '@aa900031/eslint-config': false
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  vue-demi: true
